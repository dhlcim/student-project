<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학생 성적 관리 시스템</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    h2 { color: #555; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    input { padding: 8px; margin: 4px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 16px; margin: 4px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-danger { background: #f44336; color: white; }
    .btn-edit { background: #2196F3; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #f5f5f5; }
    .grade-A { color: #4CAF50; font-weight: bold; }
    .grade-B { color: #2196F3; font-weight: bold; }
    .grade-C { color: #FF9800; font-weight: bold; }
    .grade-D { color: #FF5722; font-weight: bold; }
    .grade-F { color: #f44336; font-weight: bold; }
  </style>
</head>
<body>

  <h1>📚 학생 성적 관리 시스템</h1>

  <!-- ─────────────────────────── -->
  <!-- 학생 등록 폼 -->
  <!-- ─────────────────────────── -->
  <h2>학생 등록</h2>
  <input id="name" placeholder="이름" />
  <input id="student_number" placeholder="학번" />
  <button class="btn-primary" onclick="addStudent()">등록</button>

  <!-- ─────────────────────────── -->
  <!-- 점수 입력 폼 -->
  <!-- ─────────────────────────── -->
  <h2>점수 입력</h2>
  <input id="score_student_id" placeholder="학생 ID" />
  <input id="subject" placeholder="과목명" />
  <input id="score" placeholder="점수" type="number" />
  <button class="btn-primary" onclick="addScore()">점수 입력</button>

  <!-- ─────────────────────────── -->
  <!-- 학생 목록 테이블 -->
  <!-- ─────────────────────────── -->
  <h2>학생 목록</h2>
  <button class="btn-primary" onclick="loadStudents()">새로고침</button>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>이름</th>
        <th>학번</th>
        <th>평균</th>
        <th>등급</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>

  <script>
    // API 서버 주소
    // - 백엔드 컨테이너의 3000번 포트로 요청
    const API = "http://localhost:3000";

    // ─────────────────────────────
    // 전체 학생 목록 조회
    // - fetch: 브라우저 내장 HTTP 요청 함수
    // - async/await: 비동기 처리 (응답 올 때까지 기다림)
    // ─────────────────────────────
    async function loadStudents() {
      const res = await fetch(`${API}/students`);
      const students = await res.json();
      const tbody = document.getElementById("student-list");
      tbody.innerHTML = "";

      students.forEach((s) => {
        const gradeClass = `grade-${s.grade}`;
        tbody.innerHTML += `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.student_number}</td>
            <td>${s.average ?? "-"}</td>
            <td class="${gradeClass}">${s.grade}</td>
            <td>
              <button class="btn-edit" onclick="editStudent(${s.id}, '${s.name}', '${s.student_number}')">수정</button>
              <button class="btn-danger" onclick="deleteStudent(${s.id})">삭제</button>
            </td>
          </tr>
        `;
      });
    }

    // ─────────────────────────────
    // 학생 등록
    // - POST 요청: 서버에 데이터 전송
    // - body: JSON 형식으로 데이터 전달
    // ─────────────────────────────
    async function addStudent() {
      const name = document.getElementById("name").value;
      const student_number = document.getElementById("student_number").value;
      await fetch(`${API}/students`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, student_number }),
      });
      loadStudents();
    }

    // ─────────────────────────────
    // 학생 수정
    // - PUT 요청: 기존 데이터 수정
    // ─────────────────────────────
    async function editStudent(id, name, student_number) {
      const newName = prompt("이름 수정", name);
      const newNumber = prompt("학번 수정", student_number);
      if (!newName || !newNumber) return;
      await fetch(`${API}/students/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: newName, student_number: newNumber }),
      });
      loadStudents();
    }

    // ─────────────────────────────
    // 학생 삭제
    // - DELETE 요청: 데이터 삭제
    // ─────────────────────────────
    async function deleteStudent(id) {
      if (!confirm("삭제하시겠습니까?")) return;
      await fetch(`${API}/students/${id}`, { method: "DELETE" });
      loadStudents();
    }

    // ─────────────────────────────
    // 점수 입력
    // ─────────────────────────────
    async function addScore() {
      const student_id = document.getElementById("score_student_id").value;
      const subject = document.getElementById("subject").value;
      const score = document.getElementById("score").value;
      await fetch(`${API}/scores`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id, subject, score }),
      });
      loadStudents();
    }

    // 페이지 로드 시 학생 목록 자동 조회
    loadStudents();
  </script>

</body>
</html>
